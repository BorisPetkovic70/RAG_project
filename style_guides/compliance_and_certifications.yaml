tone_and_conventions: >-
  Write in a confident, factual corporate voice. The provider speaks as "we" or by its
  own name, and the reader is "customers" or "you". Formality is moderate: plain
  declarative sentences for a professional audience of security, compliance and
  procurement reviewers, with no marketing exclamations and no legal drafting
  formulas. The first time a standard, regulation or concept appears, give its full
  name with the abbreviation in parentheses (for example a management system, a
  business associate agreement, protected health information, a data processing
  addendum) and use the abbreviation afterwards. Give exact versions and levels
  where they matter (a standard's year, an audit report type, an authorization
  impact level). Word compliance claims precisely and differently by kind:
  "certified" or "holds certification" only for formal certifications issued after
  an independent audit; "attested" or "has received a report" for audit reports;
  "authorized" for government authorizations; "assessed by an independent assessor"
  for assessments; "aligned with", "adheres to", "abides by" or "maps its controls
  to" for laws and frameworks that have no certification; "can be configured for" or
  "supports customers' compliance with" when the obligation rests with the customer.
  State plainly when no official certification exists for a regulation and say what
  assurance is offered instead. Hedge customer benefits ("can help", "may relieve",
  "is designed to support") and never guarantee a customer's own compliance. Remind
  readers that responsibility is shared and that customers must assess and configure
  their own use. Name the assessor type (independent third-party auditor, certified
  public accounting firm, registered assessor) without naming firms. When
  describing scope, list the covered products, services, plans or regions, and note
  that coverage can differ between programs. Use short bulleted lists for enumerations
  such as products in scope, control domains, governance steps or available
  resources, and continuous prose for explanation. Tables are rare and used only for
  structured records such as revision history. ALL CAPS is not used, apart from
  abbreviations. Include concrete dates: a document publication date, certificate
  issue dates, audit coverage periods (such as a twelve-month period followed by a
  bridge letter) and revision dates. Reports and certificates are described as
  available on request, through self-service access after verification, or after
  accepting confidentiality terms, and other material is referred to generically as
  companion documents or as compliance documentation available on request. Refer to
  other parts of the same document in plain words (for example "described below" or
  "the following sections"). Close long-form documents with a notice that the content
  is informational, may change without notice, creates no warranties or commitments
  and does not modify customer agreements.

typical_length:
