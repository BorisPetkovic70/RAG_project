document_type: compliance_and_certifications

purpose: >-
  Describes the security, privacy and regulatory certifications, attestations and
  alignments a software provider maintains, and explains how customers can rely on
  them and obtain the supporting evidence. It is read by customer security,
  procurement, legal and compliance teams, and by their auditors, when assessing the
  provider as a vendor.

scope: >-
  Covers the compliance program as a whole: its purpose, the division of
  responsibility between provider and customer, the internal risk and control
  environment, the portfolio of independent certifications and attestations, how
  reports and certificates are obtained, support for security questionnaires,
  privacy and data protection obligations, sector-specific regulations, AI
  governance, guidance for customers' own compliance governance, and closing notices.
  It excludes the full text of contracts such as processing addenda or business
  associate agreements, the privacy policy itself, detailed security architecture,
  and pricing. Real versions take two forms: short catalog-style entries giving one
  or two sentences per standard alongside a question-and-answer section, and
  long-form narrative papers that explain the program in continuous prose. SaaS
  providers tend to stress which products and plans are in scope, subprocessors,
  questionnaire support and gated report access. Cloud infrastructure providers
  stress shared responsibility, inherited controls and very large catalogs of
  regional and financial-sector regulations. Providers with AI features add AI
  management system certification, AI regulation commitments and disclosure of
  training data use. A complete document describes several certifications in turn,
  each following the same pattern, and places them within the surrounding program
  topics.

core_topics:
  - name: "Compliance program overview"
    description: "Introduces the compliance program, why it exists and which customers it serves, including those in regulated industries."
    content_points:
      - "purpose of the compliance program"
      - "customers in regulated industries"
      - "independent verification of security, privacy and compliance controls"
      - "coverage of global, regional and industry standards"
      - "library of certifications and attestations"
      - "support for customers' own compliance obligations"
      - "resources for completing security and privacy questionnaires"
      - "general information on region- or sector-specific regulations (optional)"

  - name: "Shared responsibility for security and compliance"
    description: "Explains how responsibility for controls is divided between provider and customer and how that split changes with the services used."
    content_points:
      - "provider-managed infrastructure and physical controls"
      - "customer-managed configuration, access and application controls"
      - "responsibilities varying by service and integration"
      - "customer use of provider documentation for control verification"
      - "additional customer-side safeguards such as encryption and key management"
      - "controls inherited from hosting or subservice providers"
      - "outsourced data center operations and regional deployments"
      - "configuration required before regulated use"
      - "plan or add-on prerequisites for regulated use (optional)"

  - name: "Internal risk management and control environment"
    description: "Describes the provider's internal risk governance, its control framework and the reviews and monitoring that keep controls effective."
    content_points:
      - "business risk management oversight"
      - "risk assessment, remediation and escalation to leadership"
      - "recurring operational and business reviews"
      - "code of conduct and periodic employee training"
      - "organizational structure, reporting lines and segregation of duties"
      - "personnel screening and onboarding"
      - "unified internal control framework mapped to external requirements"
      - "control automation across control domains"
      - "pre-launch security and architecture reviews"
      - "post-launch reviews and vulnerability scanning"
      - "continuous control monitoring"

  - name: "Independent certifications and attestations"
    description: "Presents the portfolio of third-party audits, certifications and assessments and explains how they give customers assurance without auditing the provider directly."
    content_points:
      - "third-party attestations in place of direct customer audits"
      - "validation of control design and operating effectiveness"
      - "recurring independent audits"
      - "audits against global and regional frameworks"
      - "audits by customers or government auditors where regulation requires (optional)"
      - "grouping into certifications, laws and regulations, and frameworks or alignments"
      - "filtering by region, industry and focus area"
      - "separate attestations for affiliated product lines or government editions"
      - "product coverage varying by program, rollout or acquisition"
      - "public registry listings (optional)"
      - "trademark notices for certification marks (optional)"

  - name: "Access to compliance reports and documentation"
    description: "Explains how customers and prospects obtain reports, certificates and policies, and how report coverage is kept current."
    content_points:
      - "self-service access to compliance reports"
      - "corporate email verification for gated documents"
      - "confidentiality terms accepted before report download"
      - "requests through account team, sales or support"
      - "public summary reports versus restricted full reports"
      - "downloadable certificates"
      - "report coverage period and release timing"
      - "bridge letters between reporting periods"
      - "separate reports per product group"
      - "access to the information security policy"
      - "availability of newly released reports"

  - name: "Security questionnaires and customer due diligence"
    description: "Describes the resources that help customers complete vendor risk assessments and security questionnaires about the provider."
    content_points:
      - "vendor, supplier and security due-diligence questionnaires"
      - "pre-filled industry-standard questionnaires"
      - "cloud controls questionnaire responses"
      - "standardized information gathering questionnaire"
      - "higher-education vendor assessment toolkit"
      - "mapping of questionnaire answers to audited controls"
      - "security and encryption whitepapers as supporting evidence"
      - "support channel for remaining questions"

  - name: "Privacy and data protection compliance"
    description: "Covers how the provider supports privacy laws and data protection obligations when it processes customer data."
    content_points:
      - "support for comprehensive privacy laws"
      - "data processing addendum"
      - "pre-signed or standard processing terms"
      - "cross-border transfer mechanisms"
      - "data residency options and transfer rules"
      - "subprocessor list with roles, locations and data types"
      - "subprocessor change notifications"
      - "data center and hosting locations"
      - "privacy statement and privacy data sheets"
      - "provider role as data processor"
      - "consumer privacy rights under state laws"
      - "privacy certifications for processors and cross-border rules (optional)"

  - name: "Industry and sector regulations"
    description: "Explains how the service supports regulated industries where obligations rest with the customer and no single certification applies."
    content_points:
      - "healthcare business associate agreements"
      - "safeguards for protected health information"
      - "regulations without an official certification"
      - "recognized frameworks used as substitute assurance"
      - "financial services record retention and outsourcing rules"
      - "student education record privacy"
      - "public sector requirements"
      - "automotive information security assessments"
      - "life sciences good practice guidance (optional)"
      - "service configurable to meet a specific rule"
      - "contact point for regulated-use requirements"

  - name: "AI governance and responsible AI"
    description: "Describes certification of the AI management system, commitments under AI regulation and transparency about how AI features use data."
    content_points:
      - "AI management system certification"
      - "AI risk management controls"
      - "readiness for AI-specific regulation"
      - "responsible AI governance and transparency"
      - "disclosure of datasets used for AI training"
      - "AI products and features in certification scope"
      - "AI topics within security questionnaires (optional)"

  - name: "Customer compliance governance"
    description: "Advises customers on building and verifying their own compliance program on top of the provider's controls."
    content_points:
      - "identifying applicable compliance objectives"
      - "establishing a control environment"
      - "validation depth based on risk tolerance"
      - "verifying operating effectiveness"
      - "reviewing provider reports and documentation"
      - "documenting controls owned by outside parties"
      - "consolidated cloud control framework"
      - "customer's own assessment of vendor compliance"

  - name: "Summary of compliance commitments"
    description: "Closes by restating the provider's commitment to secure, compliant operation and how customers can follow up."
    content_points:
      - "security and resilience as top priority"
      - "recap of controls, monitoring and risk oversight"
      - "ongoing independent audits"
      - "combined effect with customer-managed controls"
      - "contact for sector-specific questions"

  - name: "Document history and legal notices"
    description: "Records publication and revision history and limits the legal effect of the document."
    content_points:
      - "publication date"
      - "revision history"
      - "notice that content may be outdated (optional)"
      - "informational purpose only"
      - "subject to change without notice"
      - "no commitments, warranties or assurances"
      - "no modification of customer agreements"
      - "customer's own independent assessment"
      - "subscription to update notifications (optional)"

optional_topics:
  - name: "Government and public-sector editions"
    description: "Describes a dedicated government edition of the service and the separate authorizations and assessments it holds."
    content_points:
      - "separate government edition"
      - "federal, state and defense authorizations"
      - "authorization impact levels"
      - "criminal justice information requirements"
      - "authorizations in progress"

  - name: "Vulnerability reporting and security advisories"
    description: "Explains how customers and researchers report vulnerabilities and how security bulletins are published."
    content_points:
      - "customer reporting channel"
      - "encrypted vulnerability reports"
      - "researcher disclosure policy"
      - "security bulletins"
      - "bulletin notifications"
      - "recommendation to run current versions"

  - name: "Business continuity and operational resilience"
    description: "Covers continuity planning and resilience obligations relevant to compliance reviews."
    content_points:
      - "business continuity and disaster recovery documentation"
      - "business continuity management system certification"
      - "financial-sector operational resilience rules"

  - name: "Corporate responsibility and trade compliance statements"
    description: "Collects company-level statements that procurement and legal reviews request alongside certifications."
    content_points:
      - "modern slavery statement"
      - "global trade and export compliance"
      - "federal procurement restrictions on certain telecommunications equipment"

certification_profile:
  description: "A section about one certification or regulation explains what it is, how the provider was assessed against it, what is covered, how current the result is, and how customers obtain the evidence."
  content_points:
    - "what the standard, framework or regulation is"
    - "issuing or governing body"
    - "objectives and criteria covered"
    - "type of assessment: certification, attestation, self-assessment or authorization"
    - "independence and qualification of the assessor"
    - "assessment standard or methodology applied"
    - "whether an official certification exists"
    - "products, services and plans in scope"
    - "applicable regions and industries"
    - "issue date, coverage period or validity"
    - "bridge letters or interim updates"
    - "how the provider's controls meet the requirements"
    - "configuration or plan requirements for customers"
    - "how customers obtain the report or certificate"
    - "confidentiality terms for restricted reports"
    - "related standards"

