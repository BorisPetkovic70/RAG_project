  - "https://cloud.google.com/vertex-ai/sla"
  - "https://legal.mistral.ai/terms/enterprise-service-level-and-support-schedule/"
  - "https://github.com/customer-terms/github-online-services-sla"
  - "https://www.atlassian.com/legal/sla"
